<div class="container col-12 col-md-6 col-lg-4">
    <h1 class="title fw-bold mb-0">Resumo do debate</h1>
    <div class="d-flex flex-row align-items-center mb-4">
        <i class="bi bi-stars txt-blue me-1 fs-4"></i>
        <p class="m-0">Gerado por IA</p>
    </div>

    <div>
        <p class="mb-0">
            {{aiText?.summary}}
        </p>
    </div>

    <div class="d-flex gap-2">
        <button class="like-button border-0" 
        [ngClass]="{ active: isLiked === true }" 
        (click)="setLike(true)">
            <i class="like-icon fs-4" 
            [ngClass]="isLiked === true ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'">
            </i>
        </button>

        <button class="dislike-button border-0" 
        [ngClass]="{ active: isLiked === false }" 
        (click)="setLike(false)">
            <i class="like-icon fs-4" 
            [ngClass]="isLiked === false ? 'bi-hand-thumbs-down-fill' : 'bi-hand-thumbs-down'">
            </i>
        </button>
    </div>
</div>

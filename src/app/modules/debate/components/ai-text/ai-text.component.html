<div class="container">
    <h1 class="fw-bold mb-2">{{ aiText?.title }}</h1>

    <div class="d-flex flex-row align-items-center mb-3">
        <i class="bi bi-stars text-primary me-2 fs-4"></i>
        <p class="m-0">Gerado por IA</p>
    </div>

    <div [innerHTML]="aiText?.text"></div>

    <div class="mt-4 text-center">
        <p class="fw-semibold mb-1">Esse texto foi útil para você? Avalie abaixo.</p>
        <div>
            <button class="like-button border-0" 
            [ngClass]="{ active: isLiked === true }" 
            (click)="setLike(true)">
                <i class="fs-4"
                [ngClass]="isLiked === true ? 'bi-hand-thumbs-up-fill' : 'bi-hand-thumbs-up'"></i>
            </button>

            <button class="dislike-button border-0" 
            [ngClass]="{ active: isLiked === false }" 
            (click)="setLike(false)">
                <i class="fs-4" 
                [ngClass]="isLiked === false ? 'bi-hand-thumbs-down-fill' : 'bi-hand-thumbs-down'"></i>
            </button>
        </div>
    </div>
</div>

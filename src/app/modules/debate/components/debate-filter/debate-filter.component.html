<div class="container">
    <form>
        <div class="d-flex flex-row justify-content-between border-bottom border-black mb-3">
            <h2 class="fw-bold">Debates</h2>
            <div class="d-flex gap-4">
                <button class="btn btn-primary rounded-5 px-5 py-0 h-75">Filtrar</button>
                <button class="btn btn-success rounded-5 px-4 py-0 h-75">Criar debate</button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-4 mb-3 col-7">
            <p class="fs-4 m-0">Pesquisa</p>
            <div class="position-relative w-100">
                <input class="form-control bg-gray ps-4 pe-5 py-1 rounded-pill border-primary-80 fst-italic w-100"
                    type="search" placeholder="Pesquisar" aria-label="Pesquisar" name="searchInput"
                    [(ngModel)]="searchInput" />

                <button class="position-absolute btn p-0 m-0 border-0 bg-transparent"
                    style="right: 15px; top: 50%; transform: translateY(-50%);" type="button" (click)="search()">
                    <i class="bi bi-search" style="font-size: 20px; color: black;"></i>
                </button>
            </div>

            <button class="btn btn-primary rounded-5 px-4 h-100">Pesquisar</button>
        </div>

        <button type="button" class="d-flex flex-row align-items-center gap-2 border-0 p-0 mb-3" (click)="toggleAdvanced()">
            <p class="fs-4 m-0 text-start">Filtro Avançado</p>
            <i class="bi fs-1" [ngClass]="isAdvanced ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
        </button>

        <div *ngIf="isAdvanced" class="d-flex flex-row flex-wrap gap-4">
            <div class="d-flex flex-row align-items-center gap-3">
                <p class="m-0">Tópico</p>
                <div class="position-relative" style="min-width: 200px;">
                    <select name="selec-topics" class="form-select custom-select bg-gray pe-5 border-primary-80 rounded-4 ps-3 py-1">
                        <option *ngFor="let topic of topics" [value]="topic.name" class="select-item">{{ topic.name }}</option>
                    </select>
                    <i class="bi bi-chevron-down position-absolute top-50 translate-middle-y end-0 me-3"></i>
                </div>
            </div>

            <div class="d-flex flex-row align-items-center gap-3">
                <p class="m-0">Palavras-chave</p>
                <div class="position-relative" style="min-width: 200px;">
                    <select name="selec-topics" class="form-select custom-select bg-gray pe-5 border-primary-80 rounded-4 ps-3 py-1">
                        <option *ngFor="let keyword of keywords" [value]="keyword.name" class="select-item">{{ keyword.name }}</option>
                    </select>
                    <i class="bi bi-chevron-down position-absolute top-50 translate-middle-y end-0 me-3"></i>
                </div>
            </div>

            <div class="d-flex flex-row align-items-center gap-3">
                <p class="m-0">Mínimo de contribuições</p>
                <div class="position-relative" style="min-width: 200px;">
                    <select name="selec-topics" class="form-select custom-select bg-gray pe-5 border-primary-80 rounded-4 ps-3 py-1">
                        <option [value]="1" class="select-item">1</option>
                        <option [value]="10" class="select-item">10</option>
                        <option [value]="50" class="select-item">50</option>
                        <option [value]="100" class="select-item">100</option>
                        <option [value]="500" class="select-item">500</option>
                        <option [value]="1000" class="select-item">1000</option>
                    </select>
                    <i class="bi bi-chevron-down position-absolute top-50 translate-middle-y end-0 me-3"></i>
                </div>
            </div>
        </div>
    </form>
</div>

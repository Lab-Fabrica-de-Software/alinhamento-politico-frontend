<div class="container py-4">

  <div *ngIf="polls.length === 0" class="text-muted text-center py-5">
    Nenhuma enquete disponível no momento.
  </div>

  <div *ngFor="let poll of polls; trackBy: trackById" class="poll-card mb-3">
    <div class="d-flex">
      <div class="poll-card__bar"></div>

      <div class="poll-card__body w-100 p-3">

        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="poll-card__category">{{ poll.category.name }}</span>
          <button class="btn btn-link p-0 text-muted">
            <i class="bi bi-share"></i>
          </button>
        </div>

        <h5 class="poll-card__title fw-bold mb-2">{{ poll.title }}</h5>

        <p class="poll-card__description text-muted mb-3">{{ poll.description }}</p>

        <div class="d-flex align-items-center gap-4">
          <span class="poll-card__meta">
            <i class="bi bi-clock me-1"></i>
            {{ getDaysRemaining(poll.expiresAt) }} dias restantes
          </span>
          <span class="poll-card__meta">
            <i class="bi bi-people me-1"></i>
            {{ poll.totalVotes | number }} votos
          </span>
          <span class="poll-card__meta">
            <i class="bi bi-person-badge me-1"></i>
            {{ getTotalPoliticians(poll) }} políticos votaram
          </span>
        </div>
      </div>
    </div>
  </div>

</div>

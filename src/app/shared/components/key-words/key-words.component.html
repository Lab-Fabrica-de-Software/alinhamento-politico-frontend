<div class="container col-12 col-md-6 col-lg-4">
    <h1 class="title fw-bold">Palavras Chaves</h1>
    <p class="category-text">Marque até 5 categorias relevantes ao seu debate</p>
    <div class="d-flex flex-row flex-wrap gap-3 mb-4">
        <button *ngFor="let keyword of keywords" class="btn btn-category border-primary-80 rounded-5 px-3 py-2"
            [ngClass]="{'bg-secondary-80': isKeywordMarked(keyword)}" (click)="toggleKeyword(keyword)">
            {{keyword.name}}
        </button>
    </div>

    <div class="d-flex justify-content-center">
        <button class="btn btn-primary text-white fw-bold rounded-5 px-3 py-2"
            (click)="openAddKeywordModal(addKeywordModal)">Adicionar palavra-chave</button>
    </div>

    <ng-template #addKeywordModal let-modal>
        <div class="modal-header border-0">
            <h4 class="modal-title fw-bold">Nova Palavra-chave</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
        </div>
        <div class="modal-body">
            <input type="text" [(ngModel)]="newKeyword" class="form-control border border-dark rounded-5"
                placeholder="Digite a nova palavra-chave">
        </div>
        <div class="modal-footer border-0">
            <button class="btn btn-success rounded-5" [disabled]="!newKeyword.trim()"
                (click)="addKeyword(modal)">Adicionar</button>
        </div>
    </ng-template>
</div>
